<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ausweise</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1e2529">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ausweise">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
  :root {
    --grund: #1e2529;
    --grund-hell: #273035;
    --papier: #efe8d8;
    --schrift: #f1ece1;
    --leise: #a9aea9;
    --linie: rgba(241, 236, 225, .18);
    --fehler: #e2a49a;
    --serif: "Iowan Old Style", "Palatino", "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --verh: 85.6 / 54;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 30%, var(--grund-hell) 0%, var(--grund) 70%);
    background-color: var(--grund);
    color: var(--schrift);
    font-family: var(--sans);
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    hyphens: none;
    -webkit-hyphens: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .ansicht { position: fixed; inset: 0; padding: inherit; display: none; }
  .ansicht.an { display: flex; }
  .leise-knopf {
    font-size: 15px; color: var(--leise); padding: 10px 14px; letter-spacing: .02em;
  }
  .leise-knopf:active { opacity: .6; }

  /* ---------- Sperre ---------- */
  #sperre { flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; }
  #sperre img.wappen {
    width: min(64vw, 300px, 40vh); width: min(64vw, 300px, 40dvh); height: auto;
    filter: drop-shadow(0 14px 34px rgba(0,0,0,.45));
    animation: erscheinen 900ms cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes erscheinen { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  #faceid-bereich { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 96px; }
  #faceid-bereich .haupt-knopf { width: min(320px, 86vw); }
  #sperre h1 { font-family: var(--serif); font-weight: 400; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; }
  form.zugang { width: min(320px, 86vw); display: flex; flex-direction: column; gap: 12px; }
  .unsichtbar { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  input.feld {
    width: 100%; font: inherit; font-size: 17px; color: var(--schrift);
    background: rgba(255,255,255,.06); border: 1px solid var(--linie); border-radius: 10px;
    padding: 13px 14px; outline: none;
  }
  input.feld:focus { border-color: rgba(241,236,225,.45); }
  .haupt-knopf {
    font-size: 17px; padding: 13px 14px; border-radius: 10px;
    background: var(--papier); color: #1e2529; font-weight: 500;
  }
  .haupt-knopf:disabled { opacity: .5; }
  .meldung { min-height: 20px; font-size: 14px; color: var(--fehler); text-align: center; }
  .hinweis { font-size: 13px; color: var(--leise); text-align: center; line-height: 1.5; max-width: 300px; }
  #loeschen-bereich { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; }

  /* ---------- Karten ---------- */
  #karten { flex-direction: column; align-items: center; }
  .kopf {
    width: min(92vw, 460px); display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0 6px; transition: opacity 300ms ease;
  }
  .kopf h2 { font-family: var(--serif); font-weight: 400; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--leise); }
  .kopf .leise-knopf { padding-right: 0; }
  .buehne {
    flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
    position: relative; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .kk {
    width: min(68vw, 400px, calc(42vh * 85.6 / 54));
    width: min(68vw, 400px, calc(42dvh * 85.6 / 54));
    aspect-ratio: var(--verh); perspective: 1600px; cursor: pointer;
    transition: width 420ms cubic-bezier(.25,.8,.25,1), transform 320ms cubic-bezier(.25,.8,.25,1), opacity 320ms ease;
  }
  #karten.gross .kk {
    width: min(96vw, 820px, calc(84vh * 85.6 / 54));
    width: min(96vw, 820px, calc(84dvh * 85.6 / 54));
  }
  .kk.ohne { transition: none; }
  .dreher { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform 700ms cubic-bezier(.3,.7,.2,1); }
  .kk.gewendet .dreher { transform: rotateY(180deg); }
  .flaeche {
    position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: var(--papier);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 18px 60px rgba(0,0,0,.38);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    color: #6b6f6a; font-size: 14px;
  }
  .flaeche img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; pointer-events: none; }
  .flaeche.rueck { transform: rotateY(180deg); }
  .flaeche.leer { background: #252d32; border: 1px dashed rgba(241,236,225,.28); box-shadow: none; color: var(--leise); }
  .flaeche.leer b { font-weight: 400; font-size: 15px; color: var(--schrift); }
  .punkte {
    position: absolute; right: max(10px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 9px; transition: opacity 300ms ease;
  }
  .punkte i { width: 6px; height: 6px; border-radius: 50%; background: rgba(241,236,225,.22); transition: background 200ms; }
  .punkte i.an { background: rgba(241,236,225,.85); }
  .fuss { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-bottom: 14px; transition: opacity 300ms ease; }
  .karten-name { font-family: var(--serif); font-size: 17px; letter-spacing: .06em; min-height: 22px; }
  #karten.gross .kopf, #karten.gross .fuss, #karten.gross .punkte { opacity: 0; pointer-events: none; }
  #karten.gross .buehne { position: fixed; inset: 0; z-index: 2; }

  /* Quer gedreht: die Karte nutzt die Breite, Kopf und Fuß werden schmal */
  @media (orientation: landscape) and (max-height: 600px) {
    .kopf { padding: 8px 0 0; }
    .fuss { flex-direction: row; gap: 14px; padding-bottom: 4px; }
    .kk {
      width: min(84vw, 720px, calc(70vh * 85.6 / 54));
      width: min(84vw, 720px, calc(70dvh * 85.6 / 54));
    }
    #karten.gross .kk {
      width: min(96vw, 900px, calc(96vh * 85.6 / 54));
      width: min(96vw, 900px, calc(96dvh * 85.6 / 54));
    }
    #sperre { flex-direction: row; gap: 40px; }
    #sperre img.wappen { width: auto; height: min(78vh, 300px); height: min(78dvh, 300px); }
  }

  /* ---------- Bearbeiten ---------- */
  #bearbeiten { flex-direction: column; align-items: center; overflow-y: auto; }
  .blatt { width: min(92vw, 460px); padding: 18px 0 40px; display: flex; flex-direction: column; gap: 16px; }
  .blatt h3 { font-family: var(--serif); font-weight: 400; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--leise); text-align: center; }
  .feld-titel { font-size: 13px; color: var(--leise); margin-bottom: 6px; }
  .bild-wahl {
    width: 100%; aspect-ratio: var(--verh); border-radius: 12px; overflow: hidden; position: relative;
    border: 1px dashed rgba(241,236,225,.28); display: flex; align-items: center; justify-content: center;
    color: var(--leise); font-size: 14px; cursor: pointer; background: rgba(255,255,255,.03);
  }
  .bild-wahl.voll { border: 0; background: var(--papier); }
  .bild-wahl img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bild-wahl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .zeile { display: flex; gap: 10px; }
  .zeile > * { flex: 1; }
  .zweit-knopf { font-size: 17px; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--linie); }
  .gefahr { color: var(--fehler); font-size: 15px; padding: 10px; }

  .warte { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20,25,28,.55); font-size: 15px; color: var(--leise); }
  .warte.an { display: flex; }
</style>
</head>
<body>

<!-- Sperre / Einrichten -->
<section class="ansicht" id="sperre">
  <img class="wappen" src="icons/wappen-gross.png" alt="">

  <div id="faceid-bereich" hidden>
    <button class="haupt-knopf" id="faceid-oeffnen" type="button" hidden>Mit Face ID öffnen</button>
    <button class="leise-knopf" id="passwort-zeigen" type="button" hidden>Passwort verwenden</button>
    <div class="meldung" id="meldung-faceid"></div>
  </div>

  <form class="zugang" id="form-oeffnen" autocomplete="on">
    <input class="unsichtbar" type="text" name="username" autocomplete="username" value="Ausweise" tabindex="-1" aria-hidden="true">
    <input class="feld" type="password" id="pw" name="password" autocomplete="current-password" placeholder="Passwort" required>
    <button class="haupt-knopf" type="submit">Öffnen</button>
    <div class="meldung" id="meldung-oeffnen"></div>
  </form>

  <form class="zugang" id="form-einrichten" autocomplete="on" hidden>
    <input class="unsichtbar" type="text" name="username" autocomplete="username" value="Ausweise" tabindex="-1" aria-hidden="true">
    <input class="feld" type="password" id="pw-neu" name="new-password" autocomplete="new-password" placeholder="Neues Passwort" required minlength="10">
    <input class="feld" type="password" id="pw-neu2" autocomplete="new-password" placeholder="Passwort wiederholen" required minlength="10">
    <button class="haupt-knopf" type="submit">Passwort festlegen</button>
    <div class="meldung" id="meldung-einrichten"></div>
    <p class="hinweis">Mindestens 10 Zeichen. Ohne dieses Passwort lassen sich die Karten nicht mehr öffnen.</p>
  </form>

  <div id="loeschen-bereich" hidden>
    <button class="leise-knopf" id="alles-loeschen" type="button">Alle Karten löschen</button>
  </div>
</section>

<!-- Karten -->
<section class="ansicht" id="karten">
  <div class="kopf">
    <h2>Ausweise</h2>
    <span>
      <button class="leise-knopf" id="faceid-einrichten" type="button" hidden>Face ID einrichten</button>
      <button class="leise-knopf" id="sperren" type="button">Sperren</button>
    </span>
  </div>
  <div class="buehne" id="buehne">
    <div class="kk" id="kk" role="button" aria-label="Karte">
      <div class="dreher">
        <div class="flaeche vorder" id="kk-vorne"></div>
        <div class="flaeche rueck" id="kk-hinten"></div>
      </div>
    </div>
    <div class="punkte" id="punkte"></div>
  </div>
  <div class="fuss">
    <div class="karten-name" id="karten-name"></div>
    <button class="leise-knopf" id="aendern" type="button">Ändern</button>
  </div>
</section>

<!-- Bearbeiten -->
<section class="ansicht" id="bearbeiten">
  <div class="blatt">
    <h3 id="blatt-titel">Karte</h3>
    <div>
      <div class="feld-titel">Bezeichnung</div>
      <input class="feld" type="text" id="b-name" maxlength="40" autocomplete="off" autocapitalize="words">
    </div>
    <div>
      <div class="feld-titel">Vorderseite</div>
      <label class="bild-wahl" id="b-vorne"><span>Foto wählen</span><input type="file" accept="image/*" id="b-vorne-datei"></label>
    </div>
    <div>
      <div class="feld-titel">Rückseite</div>
      <label class="bild-wahl" id="b-hinten"><span>Foto wählen</span><input type="file" accept="image/*" id="b-hinten-datei"></label>
    </div>
    <div class="zeile">
      <button class="zweit-knopf" id="b-abbrechen" type="button">Abbrechen</button>
      <button class="haupt-knopf" id="b-speichern" type="button">Speichern</button>
    </div>
    <button class="gefahr" id="b-leeren" type="button" hidden>Karte entfernen</button>
  </div>
</section>

<div class="warte" id="warte">Einen Moment …</div>

<script>
(function () {
  'use strict';
  var PLAETZE = 8;
  var VORGABE = ['Personalausweis', 'Schwerbehindertenausweis', '', '', '', '', '', ''];
  var ITERATIONEN = 600000;
  var enc = new TextEncoder(), dec = new TextDecoder();
  var $ = function (id) { return document.getElementById(id); };

  var schluessel = null;     // nur im Arbeitsspeicher, solange entsperrt
  var karten = [];           // entschlüsselte Karten, nur solange entsperrt
  var aktiv = 0;             // Karte im Blick
  var entwurf = null;        // Karte im Bearbeiten

  // ---------- Ablage (IndexedDB, nur auf diesem Gerät) ----------
  function db() {
    return new Promise(function (ok, fehler) {
      var r = indexedDB.open('ausweise', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('daten', { keyPath: 'id' }); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { fehler(r.error); };
    });
  }
  function lesen(id) {
    return db().then(function (d) {
      return new Promise(function (ok, fehler) {
        var r = d.transaction('daten').objectStore('daten').get(id);
        r.onsuccess = function () { ok(r.result); }; r.onerror = function () { fehler(r.error); };
      });
    });
  }
  function schreiben(obj) {
    return db().then(function (d) {
      return new Promise(function (ok, fehler) {
        var t = d.transaction('daten', 'readwrite'); t.objectStore('daten').put(obj);
        t.oncomplete = function () { ok(); }; t.onerror = function () { fehler(t.error); };
      });
    });
  }
  function entfernen(id) {
    return db().then(function (d) {
      return new Promise(function (ok, fehler) {
        var t = d.transaction('daten', 'readwrite'); t.objectStore('daten').delete(id);
        t.oncomplete = function () { ok(); }; t.onerror = function () { fehler(t.error); };
      });
    });
  }
  function allesEntfernen() {
    return db().then(function (d) {
      return new Promise(function (ok, fehler) {
        var t = d.transaction('daten', 'readwrite'); t.objectStore('daten').clear();
        t.oncomplete = function () { ok(); }; t.onerror = function () { fehler(t.error); };
      });
    });
  }

  // ---------- Verschlüsselung (AES-GCM, Schlüssel aus dem Passwort) ----------
  var rohSchluessel = null;   // dieselben 32 Byte, nur solange entsperrt (für Face ID)
  // Liefert denselben Schlüssel wie bisher (PBKDF2, 256 Bit), dazu die Rohdaten
  function ableiten(pw, salz, iter) {
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (basis) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salz, iterations: iter, hash: 'SHA-256' }, basis, 256);
    }).then(function (bits) {
      rohSchluessel = new Uint8Array(bits);
      return crypto.subtle.importKey('raw', bits, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    });
  }
  function verschluesseln(obj) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, schluessel, enc.encode(JSON.stringify(obj)))
      .then(function (ct) { return { iv: iv, ct: ct }; });
  }
  function entschluesseln(rec, k) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: rec.iv }, k || schluessel, rec.ct)
      .then(function (pt) { return JSON.parse(dec.decode(pt)); });
  }

  // ---------- Ansichten ----------
  function zeige(id) {
    ['sperre', 'karten', 'bearbeiten'].forEach(function (a) { $(a).classList.toggle('an', a === id); });
  }
  function warte(an) { $('warte').classList.toggle('an', !!an); }

  var faceIdTimer = null;
  function sperrbildschirm() {
    clearTimeout(faceIdTimer);
    return Promise.all([lesen('meta'), lesen('faceid')]).then(function (r) {
      var meta = r[0], fid = r[1] && meta;
      $('form-oeffnen').hidden = !meta || !!fid;
      $('form-einrichten').hidden = !!meta;
      $('loeschen-bereich').hidden = !meta || !!fid;
      $('faceid-bereich').hidden = !fid;
      $('faceid-oeffnen').hidden = true; $('passwort-zeigen').hidden = true;
      $('meldung-faceid').textContent = '';
      if (fid && !document.hidden) faceIdTimer = setTimeout(faceIdOeffnen, 1400);
      $('pw').value = ''; $('pw-neu').value = ''; $('pw-neu2').value = '';
      $('meldung-oeffnen').textContent = ''; $('meldung-einrichten').textContent = '';
      zeige('sperre');
    });
  }

  function sperren() {
    schluessel = null; karten = []; entwurf = null;
    if (rohSchluessel) { rohSchluessel.fill(0); rohSchluessel = null; }
    $('kk-vorne').innerHTML = ''; $('kk-hinten').innerHTML = ''; $('karten-name').textContent = '';
    $('karten').classList.remove('gross');
    $('b-vorne-datei').value = ''; $('b-hinten-datei').value = '';
    wahlZeigen('b-vorne', ''); wahlZeigen('b-hinten', ''); $('b-name').value = '';
    sperrbildschirm();
  }

  // ---------- Einrichten und Öffnen ----------
  $('form-einrichten').addEventListener('submit', function (e) {
    e.preventDefault();
    var a = $('pw-neu').value, b = $('pw-neu2').value;
    if (a.length < 10) { $('meldung-einrichten').textContent = 'Bitte mindestens 10 Zeichen.'; return; }
    if (a !== b) { $('meldung-einrichten').textContent = 'Die beiden Eingaben stimmen nicht überein.'; return; }
    warte(true);
    var salz = crypto.getRandomValues(new Uint8Array(16));
    ableiten(a, salz, ITERATIONEN).then(function (k) {
      schluessel = k;
      return verschluesseln({ pruef: 'ausweise' });
    }).then(function (pruef) {
      return schreiben({ id: 'meta', salz: salz, iterationen: ITERATIONEN, pruef: pruef });
    }).then(function () {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
      return oeffnen();
    }).catch(function () {
      $('meldung-einrichten').textContent = 'Das hat nicht geklappt. Bitte noch einmal versuchen.';
    }).then(function () { warte(false); });
  });

  $('form-oeffnen').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value;
    if (!pw) return;
    warte(true);
    lesen('meta').then(function (meta) {
      return ableiten(pw, meta.salz, meta.iterationen).then(function (k) {
        return entschluesseln(meta.pruef, k).then(function () { schluessel = k; });
      });
    }).then(function () {
      $('pw').value = '';
      return oeffnen();
    }).catch(function () {
      $('meldung-oeffnen').textContent = 'Das Passwort stimmt nicht.';
    }).then(function () { warte(false); });
  });

  // ---------- Face ID: Passkey, dessen PRF-Wert den Schlüssel verwahrt ----------
  function zufall(n) { return crypto.getRandomValues(new Uint8Array(n)); }
  function prfWert(cred) {
    var e = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
    return e && e.prf && e.prf.results && e.prf.results.first ? e.prf.results.first : null;
  }
  function huelle(prf) {
    return crypto.subtle.importKey('raw', prf, 'HKDF', false, ['deriveKey']).then(function (basis) {
      return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: enc.encode('ausweise-faceid') },
        basis, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  function faceIdAnfragen(credId, prfSalz) {
    return navigator.credentials.get({ publicKey: {
      challenge: zufall(32), timeout: 60000, userVerification: 'required',
      allowCredentials: [{ type: 'public-key', id: credId }],
      extensions: { prf: { eval: { first: prfSalz } } }
    } });
  }
  function faceIdMoeglich() {
    if (!window.PublicKeyCredential || !PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) return Promise.resolve(false);
    return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function () { return false; });
  }

  function faceIdEinrichten() {
    if (!rohSchluessel) return;
    var roh = rohSchluessel.slice(), prfSalz = zufall(32), credId = null;
    $('faceid-einrichten').textContent = 'Einen Moment …';
    navigator.credentials.create({ publicKey: {
      challenge: zufall(32), timeout: 60000,
      rp: { name: 'Ausweise' },
      user: { id: zufall(16), name: 'Ausweise', displayName: 'Ausweise' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' },
      extensions: { prf: { eval: { first: prfSalz } } }
    } }).then(function (cred) {
      credId = new Uint8Array(cred.rawId);
      var e = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
      if (!e.prf || e.prf.enabled === false) throw new Error('kein-prf');
      return prfWert(cred) || faceIdAnfragen(credId, prfSalz).then(prfWert);
    }).then(function (prf) {
      if (!prf) throw new Error('kein-prf');
      return huelle(prf);
    }).then(function (h) {
      var iv = zufall(12);
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, h, roh).then(function (ct) {
        return schreiben({ id: 'faceid', credId: credId, prfSalz: prfSalz, iv: iv, ct: ct });
      });
    }).then(function () {
      $('faceid-einrichten').textContent = 'Face ID ist eingerichtet';
      setTimeout(function () { $('faceid-einrichten').hidden = true; }, 2500);
    }).catch(function (err) {
      $('faceid-einrichten').textContent = (err && err.message === 'kein-prf')
        ? 'Face ID wird hier nicht unterstützt' : 'Face ID einrichten';
    }).then(function () { roh.fill(0); });
  }

  var faceIdLaeuft = false;
  function faceIdOeffnen() {
    if (faceIdLaeuft || schluessel) return;
    faceIdLaeuft = true;
    $('meldung-faceid').textContent = '';
    var fid, meta;
    Promise.all([lesen('faceid'), lesen('meta')]).then(function (r) {
      fid = r[0]; meta = r[1];
      return faceIdAnfragen(fid.credId, fid.prfSalz);
    }).then(function (cred) {
      var prf = prfWert(cred);
      if (!prf) throw new Error('kein-prf');
      return huelle(prf);
    }).then(function (h) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fid.iv }, h, fid.ct);
    }).then(function (bits) {
      rohSchluessel = new Uint8Array(bits);
      return crypto.subtle.importKey('raw', bits, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }).then(function (k) {
      return entschluesseln(meta.pruef, k).then(function () { schluessel = k; });
    }).then(function () {
      warte(true);
      return oeffnen();
    }).catch(function () {
      // abgebrochen, ohne Fingertipp nicht erlaubt oder nicht erkannt: Knopf und Passwort anbieten
      if (rohSchluessel && !schluessel) { rohSchluessel.fill(0); rohSchluessel = null; }
      $('faceid-oeffnen').hidden = false; $('passwort-zeigen').hidden = false;
    }).then(function () { faceIdLaeuft = false; warte(false); });
  }

  $('faceid-oeffnen').addEventListener('click', faceIdOeffnen);
  $('passwort-zeigen').addEventListener('click', function () {
    clearTimeout(faceIdTimer);
    $('form-oeffnen').hidden = false; $('passwort-zeigen').hidden = true; $('loeschen-bereich').hidden = false;
    $('pw').focus();
  });
  $('faceid-einrichten').addEventListener('click', function () {
    if ($('faceid-einrichten').textContent === 'Face ID einrichten') faceIdEinrichten();
  });

  function oeffnen() {
    var aufgaben = [];
    for (var i = 0; i < PLAETZE; i++) {
      aufgaben.push(lesen('karte-' + i).then(function (rec) { return rec ? entschluesseln(rec) : null; }));
    }
    return Promise.all(aufgaben).then(function (liste) {
      karten = liste.map(function (k, i) { return k || { name: VORGABE[i], vorne: '', hinten: '' }; });
      Promise.all([lesen('faceid'), faceIdMoeglich()]).then(function (r) {
        $('faceid-einrichten').textContent = 'Face ID einrichten';
        $('faceid-einrichten').hidden = !!r[0] || !r[1];
      });
      anzeigen(0);
    });
  }

  // ---------- Karten: eine Karte im Blick, wischen blättert ----------
  function istLeer(i) { return !karten[i] || !karten[i].vorne; }

  function flaecheFuellen(el, src, leerText) {
    el.innerHTML = '';
    el.classList.toggle('leer', !src);
    if (src) { var img = document.createElement('img'); img.src = src; img.alt = ''; el.appendChild(img); }
    else { el.innerHTML = leerText; }
  }

  function karteZeichnen() {
    var k = karten[aktiv];
    $('kk').classList.add('ohne'); $('kk').classList.remove('gewendet');
    void $('kk').offsetWidth; $('kk').classList.remove('ohne');
    if (istLeer(aktiv)) {
      flaecheFuellen($('kk-vorne'), '', '<b></b><span>Karte hinzufügen</span>');
      $('kk-vorne').querySelector('b').textContent = k.name || 'Freier Platz';
    } else {
      flaecheFuellen($('kk-vorne'), k.vorne, '');
    }
    flaecheFuellen($('kk-hinten'), k.hinten, '<span>Keine Rückseite</span>');
    $('karten-name').textContent = istLeer(aktiv) ? '' : (k.name || '');
    $('aendern').hidden = istLeer(aktiv);
    var pk = $('punkte').children;
    for (var i = 0; i < pk.length; i++) pk[i].classList.toggle('an', i === aktiv);
  }

  function anzeigen(i) {
    aktiv = Math.max(0, Math.min(PLAETZE - 1, i || 0));
    $('punkte').innerHTML = '';
    for (var j = 0; j < PLAETZE; j++) $('punkte').appendChild(document.createElement('i'));
    $('karten').classList.remove('gross');
    karteZeichnen();
    zeige('karten');
  }

  var blaettertGerade = false;
  function blaettern(richtung) {
    var neu = aktiv + richtung;
    if (neu < 0 || neu >= PLAETZE || blaettertGerade) {
      var kk = $('kk'); kk.style.transform = 'translateY(' + (-richtung * 14) + 'px)';
      setTimeout(function () { kk.style.transform = ''; }, 160);
      return;
    }
    blaettertGerade = true;
    var kk = $('kk');
    kk.style.transform = 'translateY(' + (-richtung * 70) + '%)'; kk.style.opacity = '0';
    setTimeout(function () {
      aktiv = neu; karteZeichnen();
      kk.classList.add('ohne');
      kk.style.transform = 'translateY(' + (richtung * 70) + '%)';
      void kk.offsetWidth; kk.classList.remove('ohne');
      kk.style.transform = ''; kk.style.opacity = '';
      setTimeout(function () { blaettertGerade = false; }, 320);
    }, 300);
  }

  // Tippen dreht, Doppeltippen macht groß oder klein, Wischen blättert
  var start = null, tippZeit = 0, tippWarte = null;
  $('buehne').addEventListener('pointerdown', function (e) {
    start = { x: e.clientX, y: e.clientY, t: Date.now(), aufKarte: $('kk').contains(e.target) };
  });
  $('buehne').addEventListener('pointerup', function (e) {
    if (!start) return;
    var dx = e.clientX - start.x, dy = e.clientY - start.y, aufKarte = start.aufKarte;
    start = null;
    if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) {
      clearTimeout(tippWarte); tippWarte = null;
      blaettern(dy < 0 ? 1 : -1);
      return;
    }
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12 || !aufKarte) return;
    var jetzt = Date.now();
    if (tippWarte && jetzt - tippZeit < 300) {
      clearTimeout(tippWarte); tippWarte = null;
      if (!istLeer(aktiv)) $('karten').classList.toggle('gross');
      return;
    }
    tippZeit = jetzt;
    tippWarte = setTimeout(function () {
      tippWarte = null;
      if (istLeer(aktiv)) bearbeiten(aktiv); else $('kk').classList.toggle('gewendet');
    }, 300);
  });
  $('buehne').addEventListener('pointercancel', function () { start = null; });
  $('aendern').addEventListener('click', function () { bearbeiten(aktiv); });
  document.addEventListener('keydown', function (e) {
    if (!$('karten').classList.contains('an')) return;
    if (e.key === 'ArrowDown') blaettern(1);
    if (e.key === 'ArrowUp') blaettern(-1);
    if (e.key === ' ') { e.preventDefault(); if (!istLeer(aktiv)) $('kk').classList.toggle('gewendet'); }
    if (e.key === 'Enter' && !istLeer(aktiv)) $('karten').classList.toggle('gross');
    if (e.key === 'Escape') $('karten').classList.remove('gross');
  });

  // ---------- Bearbeiten ----------
  function wahlZeigen(id, src) {
    var el = $(id), span = el.querySelector('span'), alt = el.querySelector('img');
    if (alt) alt.remove();
    el.classList.toggle('voll', !!src);
    span.hidden = !!src;
    if (src) { var img = document.createElement('img'); img.src = src; img.alt = ''; el.insertBefore(img, el.firstChild); }
  }
  function bearbeiten(i) {
    var k = karten[i];
    entwurf = { platz: i, name: k.name || '', vorne: k.vorne || '', hinten: k.hinten || '' };
    $('blatt-titel').textContent = k.vorne ? 'Karte ändern' : 'Karte hinzufügen';
    $('b-name').value = entwurf.name;
    wahlZeigen('b-vorne', entwurf.vorne);
    wahlZeigen('b-hinten', entwurf.hinten);
    $('b-leeren').hidden = !k.vorne;
    $('b-leeren').textContent = 'Karte entfernen';
    $('b-leeren').dataset.sicher = '';
    zeige('bearbeiten');
  }

  // Foto verkleinern und neu speichern: entfernt dabei auch Ortsangaben und andere Zusatzdaten
  function fotoLaden(datei) {
    return new Promise(function (ok, fehler) {
      var url = URL.createObjectURL(datei), img = new Image();
      img.onload = function () {
        var max = 1600, f = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.86));
      };
      img.onerror = function () { URL.revokeObjectURL(url); fehler(); };
      img.src = url;
    });
  }
  function dateiWahl(inputId, feld, anzeige) {
    $(inputId).addEventListener('change', function () {
      var d = this.files && this.files[0];
      if (!d || !entwurf) return;
      warte(true);
      fotoLaden(d).then(function (src) { entwurf[feld] = src; wahlZeigen(anzeige, src); })
        .catch(function () {}).then(function () { warte(false); });
      this.value = '';
    });
  }
  dateiWahl('b-vorne-datei', 'vorne', 'b-vorne');
  dateiWahl('b-hinten-datei', 'hinten', 'b-hinten');

  $('b-abbrechen').addEventListener('click', function () {
    var i = entwurf ? entwurf.platz : -1; entwurf = null;
    anzeigen(i >= 0 ? i : aktiv);
  });
  $('b-speichern').addEventListener('click', function () {
    if (!entwurf) return;
    var i = entwurf.platz;
    var k = { name: $('b-name').value.trim(), vorne: entwurf.vorne, hinten: entwurf.hinten };
    warte(true);
    verschluesseln(k).then(function (rec) {
      rec.id = 'karte-' + i; return schreiben(rec);
    }).then(function () {
      karten[i] = k; entwurf = null; anzeigen(i);
    }).catch(function () {}).then(function () { warte(false); });
  });
  $('b-leeren').addEventListener('click', function () {
    var b = $('b-leeren');
    if (!b.dataset.sicher) { b.dataset.sicher = '1'; b.textContent = 'Wirklich entfernen? Noch einmal tippen.'; return; }
    var i = entwurf.platz;
    entfernen('karte-' + i).then(function () {
      karten[i] = { name: VORGABE[i], vorne: '', hinten: '' }; entwurf = null;
      anzeigen(i);
    });
  });

  // ---------- Sperren ----------
  $('sperren').addEventListener('click', sperren);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearTimeout(faceIdTimer); if (schluessel) sperren(); }
    else if (!schluessel) sperrbildschirm();
  });
  window.addEventListener('pagehide', function () { if (schluessel) sperren(); });

  $('alles-loeschen').addEventListener('click', function () {
    var b = $('alles-loeschen');
    if (!b.dataset.sicher) { b.dataset.sicher = '1'; b.textContent = 'Alle Karten und das Passwort löschen? Noch einmal tippen.'; return; }
    allesEntfernen().then(function () { b.dataset.sicher = ''; b.textContent = 'Alle Karten löschen'; sperrbildschirm(); });
  });

  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  sperrbildschirm();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
