<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visitenkarte</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e2529">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visitenkarte">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
  :root { --grund: #1e2529; --grund-hell: #273035; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, var(--grund-hell) 0%, var(--grund) 70%);
    background-color: var(--grund);
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  /* Groß im Hoch- und im Querformat: so breit wie möglich, ohne oben oder unten anzustoßen */
  .karte {
    width: min(90vw, 720px, calc(80vh * 85 / 55));
    width: min(90vw, 720px, calc(80dvh * 85 / 55));
    aspect-ratio: 85 / 55;
    perspective: 1600px;
    cursor: pointer;
    outline: none;
    opacity: 0;
    transition: opacity 250ms ease;
  }
  .karte.da { opacity: 1; }
  .dreher {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 750ms cubic-bezier(.3, .7, .2, 1);
  }
  .karte.gewendet .dreher { transform: rotateY(180deg); }
  .seite {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 3px;
    box-shadow: 0 1px 3px rgba(0,0,0,.10), 0 16px 70px rgba(0,0,0,.30);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .rueck { transform: rotateY(180deg); }
  .karte:focus-visible .seite { box-shadow: 0 0 0 2px #8fb3b6, 0 16px 70px rgba(0,0,0,.30); }
  @media (prefers-reduced-motion: reduce) {
    .karte, .dreher { transition: none; }
  }
</style>
</head>
<body>
  <div class="karte" id="karte" role="button" tabindex="0" aria-label="Visitenkarte wenden">
    <div class="dreher">
      <img class="seite vorder" id="vorne" src="bilder/vorne-1.jpg" alt="Psychotherapeutikum">
      <img class="seite rueck" src="bilder/hinten.jpg" alt="L. K. Landeberg, Psychologische Psychotherapeutin, Kinder- und Jugendpsychotherapeutin, Verkehrspsychologin, M.Sc. Ingenieurpsychologin">
    </div>
  </div>

<script>
  (function () {
    var ANZAHL = 8;
    var karte = document.getElementById('karte');
    var vorne = document.getElementById('vorne');

    function lesen() { try { return parseInt(localStorage.getItem('vk-letzte'), 10) || 0; } catch (e) { return 0; } }
    function merken(n) { try { localStorage.setItem('vk-letzte', String(n)); } catch (e) {} }

    function neueVorderseite(fertig) {
      var letzte = lesen(), n;
      do { n = 1 + Math.floor(Math.random() * ANZAHL); } while (n === letzte && ANZAHL > 1);
      merken(n);
      var bild = new Image();
      bild.onload = bild.onerror = function () { vorne.src = bild.src; if (fertig) fertig(); };
      bild.src = 'bilder/vorne-' + n + '.jpg';
    }

    function wenden() { karte.classList.toggle('gewendet'); }
    karte.addEventListener('click', wenden);
    karte.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); wenden(); }
    });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });

    // Nach längerer Pause wieder mit einer neuen Vorderseite beginnen
    var verborgenSeit = 0;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { verborgenSeit = Date.now(); return; }
      if (verborgenSeit && Date.now() - verborgenSeit > 1500) {
        karte.classList.remove('gewendet');
        neueVorderseite();
      }
    });

    for (var i = 1; i <= ANZAHL; i++) { (new Image()).src = 'bilder/vorne-' + i + '.jpg'; }
    (new Image()).src = 'bilder/hinten.jpg';

    neueVorderseite(function () { karte.classList.add('da'); });

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  })();
</script>
</body>
</html>
