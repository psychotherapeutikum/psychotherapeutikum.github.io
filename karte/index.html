<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visitenkarte</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e2529">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visitenkarte">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
  :root { --grund: #1e2529; --grund-hell: #273035; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, var(--grund-hell) 0%, var(--grund) 70%);
    background-color: var(--grund);
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .buehne {
    width: min(88vw, 640px, calc(78vh * 85 / 55));
    width: min(88vw, 640px, calc(78dvh * 85 / 55));
    aspect-ratio: 85 / 55;
    perspective: 1600px;
  }
  .buehne.auf { animation: aufgehen 700ms cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes aufgehen {
    from { transform: scale(.16); opacity: 0; }
    35%  { opacity: 1; }
    to   { transform: scale(1); opacity: 1; }
  }
  .karte {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 750ms cubic-bezier(.3, .7, .2, 1);
    outline: none;
  }
  .karte.gewendet { transform: rotateY(180deg); }
  .seite {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,.28), 0 18px 50px rgba(0,0,0,.45);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .rueck { transform: rotateY(180deg); }
  .karte:focus-visible .seite { box-shadow: 0 0 0 2px #8fb3b6, 0 18px 50px rgba(0,0,0,.45); }
  @media (prefers-reduced-motion: reduce) {
    .buehne.auf { animation: none; }
    .karte { transition: none; }
  }
</style>
</head>
<body>
  <main class="buehne" id="buehne">
    <div class="karte" id="karte" role="button" tabindex="0" aria-label="Visitenkarte wenden">
      <img class="seite vorder" id="vorne" src="bilder/vorne-1.jpg" alt="Psychotherapeutikum">
      <img class="seite rueck" src="bilder/hinten.jpg" alt="L. K. Landeberg, Psychologische Psychotherapeutin, Kinder- und Jugendpsychotherapeutin, Verkehrspsychologin, M.Sc. Ingenieurpsychologin">
    </div>
  </main>

<script>
  (function () {
    var ANZAHL = 8;
    var buehne = document.getElementById('buehne');
    var karte = document.getElementById('karte');
    var vorne = document.getElementById('vorne');

    function lesen() { try { return parseInt(localStorage.getItem('vk-letzte'), 10) || 0; } catch (e) { return 0; } }
    function merken(n) { try { localStorage.setItem('vk-letzte', String(n)); } catch (e) {} }

    function neueVorderseite() {
      var letzte = lesen(), n;
      do { n = 1 + Math.floor(Math.random() * ANZAHL); } while (n === letzte && ANZAHL > 1);
      merken(n);
      return 'bilder/vorne-' + n + '.jpg';
    }

    function oeffnen() {
      karte.style.transition = 'none';
      karte.classList.remove('gewendet');
      void karte.offsetWidth;
      karte.style.transition = '';
      buehne.classList.remove('auf');
      var bild = new Image();
      bild.onload = bild.onerror = function () {
        vorne.src = bild.src;
        void buehne.offsetWidth;
        buehne.classList.add('auf');
      };
      bild.src = neueVorderseite();
    }

    function wenden() { karte.classList.toggle('gewendet'); }
    karte.addEventListener('click', wenden);
    karte.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); wenden(); }
    });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    var verborgenSeit = 0;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { verborgenSeit = Date.now(); }
      else if (verborgenSeit && Date.now() - verborgenSeit > 1500) { oeffnen(); }
    });

    for (var i = 1; i <= ANZAHL; i++) { (new Image()).src = 'bilder/vorne-' + i + '.jpg'; }
    (new Image()).src = 'bilder/hinten.jpg';

    oeffnen();

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  })();
</script>
</body>
</html>
